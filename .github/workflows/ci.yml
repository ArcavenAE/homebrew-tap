name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  audit:
    name: Formula Audit
    runs-on: macos-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tap local checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/arcavenae"
          ln -sf "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/arcavenae/homebrew-tap"

      - name: Trust this tap
        run: |
          brew --version
          brew trust --tap arcavenae/tap

      - name: Audit formulas
        run: |
          failed=""
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            brew audit --strict "arcavenae/tap/$name" || failed="$failed $name"
          done
          if [ -n "$failed" ]; then
            echo "::error::brew audit failed for:$failed"
            exit 1
          fi

      - name: Check style
        run: |
          failed=""
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            brew style "arcavenae/tap/$name" || failed="$failed $name"
          done
          if [ -n "$failed" ]; then
            echo "::error::brew style failed for:$failed"
            exit 1
          fi
